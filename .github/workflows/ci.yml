name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ow_helper.sln

      - name: Build
        run: dotnet build ow_helper.sln -c Release --no-restore

      - name: Test
        run: dotnet test ow_helper.sln -c Release --no-build

      - name: Publish smoke
        shell: pwsh
        run: ./scripts/publish.ps1

      - name: Verify artifacts
        shell: pwsh
        run: |
          foreach ($f in 'OwHelper.Desktop.exe', 'OwHelper.exe', 'BgKeyProbe.exe') {
            if (-not (Test-Path "artifacts/OwHelper-win-x64/$f")) { throw "missing $f" }
          }

      - name: Publish installer source
        shell: pwsh
        run: ./scripts/publish-installer.ps1

      - name: Verify installer source purity
        shell: pwsh
        run: |
          $forbidden = @(
            'BgKeyProbe.exe', 'BgKeyProbe.dll', 'BgKeyProbe.deps.json', 'BgKeyProbe.runtimeconfig.json',
            'OwHelper.exe', 'OwHelper.deps.json', 'OwHelper.runtimeconfig.json'
          )
          foreach ($f in $forbidden) {
            if (Test-Path "artifacts/OwHelper-installer-source/$f") {
              throw "Installer source contains forbidden artifact: $f"
            }
          }
          if (-not (Test-Path "artifacts/OwHelper-installer-source/OwHelper.Desktop.exe")) {
            throw "Installer source missing OwHelper.Desktop.exe"
          }

      - name: Installer smoke
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' installer/OwHelper.iss /DAppVersion=0.0.0
          if (-not (Test-Path 'artifacts/packages/OwHelper-Setup-0.0.0.exe')) { throw 'installer not produced' }
