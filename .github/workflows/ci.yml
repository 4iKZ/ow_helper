name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ow_helper.sln

      - name: Build
        run: dotnet build ow_helper.sln -c Release --no-restore

      - name: Test
        run: dotnet test ow_helper.sln -c Release --no-build
