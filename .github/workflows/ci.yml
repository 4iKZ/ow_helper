name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ow_helper.sln

      - name: Build
        run: dotnet build ow_helper.sln -c Release --no-restore

      - name: Test
        run: dotnet test ow_helper.sln -c Release --no-build

      - name: Publish smoke
        shell: pwsh
        run: ./scripts/publish.ps1

      - name: Verify artifacts
        shell: pwsh
        run: |
          foreach ($f in 'OwHelper.Desktop.exe', 'OwHelper.exe', 'BgKeyProbe.exe') {
            if (-not (Test-Path "artifacts/OwHelper-win-x64/$f")) { throw "missing $f" }
          }
